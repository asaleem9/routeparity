# Reported: /my-path/ (medium), and /docs/ under a covering Prefix / (low, uncertain).
# Not reported: / itself, /both/ whose slashless form has its own rule, and /app/ on a regex host.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slash
  namespace: demo

spec:
  ingressClassName: nginx
  rules:
  - host: slash.example.com
    http:
      paths:
      - path: "/my-path/"
        pathType: Exact
        backend:
          service:
            name: web
            port:
              number: 80
      - path: "/both/"
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
      - path: "/both"
        pathType: Exact
        backend:
          service:
            name: web
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: covered
  namespace: demo

spec:
  ingressClassName: nginx
  rules:
  - host: covered.example.com
    http:
      paths:
      - path: "/docs/"
        pathType: Prefix
        backend:
          service:
            name: docs
            port:
              number: 80
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regex-host
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: slash-regex.example.com
    http:
      paths:
      - path: "/app/"
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
