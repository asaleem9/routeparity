name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the echo binaries
        run: |
          mkdir -p bin/echo-image
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
            -o bin/echo-image/routeparity-echo-amd64 ./cmd/routeparity-echo
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
            -o bin/echo-image/routeparity-echo-arm64 ./cmd/routeparity-echo

      - uses: docker/build-push-action@v6
        id: echo
        with:
          context: bin/echo-image
          file: hack/echo.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/asaleem9/routeparity-echo:${{ github.ref_name }}
            ghcr.io/asaleem9/routeparity-echo:latest

      - name: Sign the echo image
        run: cosign sign --yes "ghcr.io/asaleem9/routeparity-echo@${{ steps.echo.outputs.digest }}"
