name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go the module supports and the current release. They
        # differ in ways that matter, such as what a test binary records
        # about its dependencies.
        go: ["1.25.5", "stable"]
    name: test (go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test -race -cover ./...
      - name: Build
        run: make build
      - name: Audit the example manifests
        # The example is written to trigger findings, so only fail if the
        # tool itself errors.
        run: ./bin/routeparity audit -f examples/five-behaviours/ --fail-on none

  e2e:
    # Runs the lab against real ingress-nginx in a kind cluster and checks the
    # behaviours the audit rules are built on.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run the lab end to end
        run: make e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
