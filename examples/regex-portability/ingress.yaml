# Standard-emitter regex portability: the case-insensitive RE2 expression
# accepted by Envoy and Istio is rejected by NGINX Gateway Fabric 2.8.1.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regex-portability
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: regex-portability.example.com
    http:
      paths:
      - path: /[A-Z]{3}
        pathType: ImplementationSpecific
        backend:
          service:
            name: httpbin
            port:
              number: 80
